name: Sync media

# Downloads every image listed in scripts/media-sources.txt into public/media
# and points src/content/media.ts at the local copies.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-media.mjs --download
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media src/content/media.ts
          git diff --cached --quiet && echo "Nothing new" || (git commit -m "Sync generated media into the repo" && git push)
